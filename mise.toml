[dotfiles]
"~/.config/mise/config.toml" = { source = "mise.toml" }
"~/.scripts" = { source = "scripts" }
"~/.bashrc.d" = { source = "profile" }
"~/.config/peanutbutter" = { source = "peanutbutter" }
"~/.config/zellij" = { source = "zellij" }
"~/.config/nvim" = { source = "nvim" }
"~/.vscode/launch.json" = { source = "vscode/launch.json" }
"~/.config/niri/overrides.kdl" = { source = "niri/overrides.kdl" }
"~/.config/noctalia/templates.toml" = { source = "noctalia/templates.toml" }
"~/.config/noctalia/templates" = { source = "noctalia/templates" }
"~/.agents/skills" = { source = "agents/skills" }
"~/.claude/skills" = { source = "agents/skills" }
"~/.pi/agent/extensions" = { source = "pi/extensions" }
"~/.pi/agent/autoformatter.json" = { source = "pi/autoformatter.json" }
"~/.pi/agent/sol-pi.json" = { source = "pi/sol-pi.json" }
"~/.pi/agent/pi-profiles.json" = { source = "pi/pi-profiles.json" }
"~/.pi/agent/prompts" = { source = "agents/prompts" }

[bootstrap.hooks]
post-dotfiles = 'bash "$HOME/.scripts/bashrc.d.sh"'

[tasks.where]
run = "pwd; echo {{ config_root }}"

[tools]
claude = "latest"
codex = "latest"
fzf = "latest"
gh = "latest"
"github:calamity-m/peanutbutter" = "latest"
"github:unkn0wn-root/resterm" = "latest"
go = "latest"
gradle = "latest"
helm = "latest"
java = "lts"
lazygit = "latest"
maven = "latest"
neovim = "nightly"
node = "24.21.0"
npm = "12.2.0"
pi = "latest"
rust = "latest"
tree-sitter = "latest"
uv = "latest"
zellij = "latest"
zoxide = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node"]
